# ------------------------------------------------------------------
# theme
# ------------------------------------------------------------------
[theme]
name = "material"
logo = "assets/images/generated/khiops-logo-ui.png"
favicon = "assets/images/generated/khiops-logo-favicon.png"
custom_dir = "overrides"
font = false
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.expand",
  "navigation.indexes",
  "navigation.footer",
  "content.code.copy",
  "content.tooltips",
]

[theme.icon]
repo = "fontawesome/brands/github"

[[theme.palette]]
media = "(prefers-color-scheme)"
primary = "black"
accent = "indigo"

[theme.palette.toggle]
icon = "lucide/sun-moon"
name = "Switch to light mode"

[[theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"

[theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to dark mode"

[[theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"

[theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to system preference"

