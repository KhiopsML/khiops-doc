# ------------------------------------------------------------------
# plugins
# ------------------------------------------------------------------
[plugins]
macros = {}
search = {}

[plugins.llmstxt]
markdown_description = """
> Khiops is an interpretable and scalable data science platform with a Python library, desktop GUI applications, and deployment tools.

This index maps the Khiops documentation and exported KNI examples to their
primary tasks or subjects. Start with the overview or a tutorial, then use the
API references for detailed syntax and the examples for integration guidance.
Prefer these versioned pages over inferring behavior from implementation
details. Python API pages are rendered from the published documentation
sources; adapt examples to the installed version.

Choose a section based on your task:

- **Python development and tutorials**: Install the Python library, follow hands-on tutorials, and consult the Core and scikit-learn API references.
- **Data science and foundations**: Understand the MODL formalism and the statistical concepts behind Khiops' automated data preparation and modeling.
- **Khiops dictionaries**: Learn the dictionary (KDIC) language used to describe data and define derivation rules, from tutorials to the full rule reference.
- **Installation, deployment, and integration**: Install Khiops applications and drivers, and run or deploy Khiops in Docker, Kubernetes, batch, or cloud-storage environments.
- **Khiops Native Interface (KNI)**: Build and run the C, Java, and Python tutorial examples for real-time, in-memory model scoring.
- **User interfaces**: Use the desktop GUI applications to explore data, build models, and visualize analysis and coclustering reports.
- **External references**: Find the source repositories for Khiops, its Python library, and the KNI tutorial.
- **Optional**: Find contact details and legal notices.

## Khiops Native Interface (KNI)

- [KNI tutorial guide](tutorials/kni-tutorial/README.md): Install KNI and build C, Java, and Python examples for single-table and multi-table recoding.
- [KNI API header](tutorials/kni-tutorial/include/KhiopsNativeInterface.h): The C++ header that defines the KNI API.
- [KNI C single-table example](tutorials/kni-tutorial/cpp/KNIRecodeFile.c): With C, compile and run `KNIRecodeFile` to recode a single-table input with a Khiops dictionary.
- [KNI C multi-table example](tutorials/kni-tutorial/cpp/KNIRecodeMTFiles.c): With C, compile and run `KNIRecodeMTFiles` to recode multi-table inputs into one output file.
- [KNI Java interface](tutorials/kni-tutorial/java/KNI.java): JNA bindings that expose the KNI native library to Java.
- [KNI Java example](tutorials/kni-tutorial/java/KNIRecodeFile.java): Build and run a Java single-table recoding application through JNA.
- [KNI Python single-table example](tutorials/kni-tutorial/python/KNIRecodeFile.py): With Python, use the `khiops-kni` package to recode a single-table input.
- [KNI Python multi-table example](tutorials/kni-tutorial/python/KNIRecodeMTFiles.py): With Python, use the `khiops-kni` package to recode multi-table inputs.
- [KNI python API doc](tutorials/kni-tutorial/python/docs/kni.md): Documentation of the package pip khiops-kni

## External references

- [Khiops source](https://github.com/KhiopsML/khiops): Find the source repository, package information, and development resources for Khiops.
- [Khiops Python package source](https://github.com/KhiopsML/khiops-python): Find the source repository, package information, and development resources for the Khiops Python library.
- [KNI Tutorial](https://github.com/KhiopsML/KNI-tutorial): Find the source repository for the KNI tutorial examples listed in the Khiops Native Interface (KNI) section above.
"""

