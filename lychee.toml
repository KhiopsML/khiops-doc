# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Only check local/internal links (no external HTTP requests during CI)
# Remove or set to false to also check external links
include_fragments = true

# Exclude patterns (add URLs or regex patterns that should be skipped)
exclude = [
  # GitHub rate-limits unauthenticated requests
  "https://github.com/.*/(edit|new|upload|delete)",
  # Anchors generated by MkDocs Material that lychee can't resolve
  "javascript:.*",
]

# Exclude file paths from being scanned
exclude_path = [
  # Python API docs are fetched externally and may contain stale links
  "site/api-docs/python-api/api",
]
