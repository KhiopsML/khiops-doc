name: Synchronize discussions

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discussion-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name != 'schedule' || vars.DISCUSSION_SYNC_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Generate documentation and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python -m scripts.generate_discussions --report "$RUNNER_TEMP/discussion-report.md"
          cat "$RUNNER_TEMP/discussion-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/sync-discussions
          base: ${{ github.event.repository.default_branch }}
          title: "Synchronize discussion topics"
          commit-message: "Synchronize discussion topics"
          body-path: ${{ runner.temp }}/discussion-report.md
