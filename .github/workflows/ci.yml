---
name: Website
on:
  workflow_dispatch:
    inputs:
      khiops-version:
        description: Khiops core version
        default: "11.0.1"
      khiops-python-ref:
        description: khiops-python Git ref/tag to build the API docs from
        default: "11.0.1.0"
      khiops-samples-version:
        description: khiops-samples release
        default: "11.0.0"
      khiops-python-tutorial-ref:
        description: khiops-python-tutorial Git ref
        default: "11.0.0.0"
      khiops-viz-version:
        description: Khiops Visualization version (empty = latest release)
        default: ""
      khiops-gcs-driver-version:
        description: Khiops GCS driver version
        default: "0.0.23"
      khiops-s3-driver-version:
        description: Khiops S3 driver version
        default: "0.0.25"
      khiops-azure-driver-version:
        description: Khiops Azure driver version
        default: "0.0.18"
      execute-khiops-tutorials:
        description: Execute khiops-doc's own tutorial notebooks
        required: true
        type: boolean
        default: false
      deploy-gh-pages:
        description: Deploy to GH Pages
        required: true
        type: boolean
        default: false
      check-links:
        description: Check for broken links
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build-or-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install wget libarchive-tools
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Checkout doc sources
        uses: actions/checkout@v6
      - name: Retrieve the version number of Khiops Visualization Desktop from the latest release on GitHub
        if: inputs.khiops-viz-version == ''
        id: khiops-viz-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "gh release view" shows the latest release in the project, we extract its version (without the leading "v")
          LAST_TAG="$(gh --repo https://github.com/KhiopsML/khiops-visualization-desktop/ release view --json tagName --jq '.tagName')"
          echo "value=${LAST_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Khiops core
        env:
          KHIOPS_VERSION: ${{ inputs.khiops-version }}
        run: |
          # Create virtual environment and activate it
          uv venv
          . .venv/bin/activate

          # Building the Python API docs always executes khiops-python's own
          # tutorial notebooks (create-doc -t -d), so a real Khiops core
          # install is required unconditionally.
          uv pip install khiops-core==${KHIOPS_VERSION}
      - name: Build documentation
        run: |
          # Activate virtual environment
          . .venv/bin/activate

          # Build the documentation
          ARGS=(
            --khiops-version "${{ inputs.khiops-version }}"
            --khiops-python-ref "${{ inputs.khiops-python-ref }}"
            --khiops-samples-version "${{ inputs.khiops-samples-version }}"
            --khiops-python-tutorial-ref "${{ inputs.khiops-python-tutorial-ref }}"
            --khiops-viz-version "${{ inputs.khiops-viz-version || steps.khiops-viz-version.outputs.value }}"
            --khiops-gcs-driver-version "${{ inputs.khiops-gcs-driver-version }}"
            --khiops-s3-driver-version "${{ inputs.khiops-s3-driver-version }}"
            --khiops-azure-driver-version "${{ inputs.khiops-azure-driver-version }}"
          )
          if [[ "${{ inputs.execute-khiops-tutorials }}" == "true" ]]; then
            ARGS+=(--execute-tutorials)
          fi
          bash .github/scripts/build-doc.sh "${ARGS[@]}"
      - name: Check for broken links
        if: inputs.check-links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir site --no-progress --accept 200,403 --exclude 'file:///.*\d+\.\d+\.\d+' 'site/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the site docs as an artifact (PR)
        if: inputs.deploy-gh-pages == false
        uses: actions/upload-artifact@v7
        with:
          name: khiops-doc
          path: ./site/
      - name: Configure Git Credentials
        if: github.event_name == 'workflow_dispatch' && inputs.deploy-gh-pages == true
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Deploy site to GH pages (Manual)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy-gh-pages == true
        run: |
          # Push built site directory contents to GH pages
          uv run ghp-import -m "Deployed ${GITHUB_SHA:0:7}" --push --force --no-jekyll ./site/
